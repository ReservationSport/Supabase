<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBZO Hallenbelegung</title>
    <!-- Google Material Symbols für das Megaphon-Icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            background-image: url('background.png');
            background-size: cover;         
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0); 
            z-index: -1;
        }

        .news-ticker-container {
            position: fixed;
            top: 5%;
            left: 25%;
            width: 50%;
            background: rgb(228, 0, 0);
            border-bottom: 3px solid rgb(255, 255, 255);
            padding: 12px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0);
            display: none;
            align-items: center;
            box-sizing: border-box;
            z-index: 9999;
            overflow: hidden;
        }

        .news-icon {
            font-size: 2.1em;
            color: #ffffff;
            margin-right: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .ticker-wrapper {
            overflow: hidden;
            width: 100%;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .ticker-text {
            display: inline-block;
            color: #ffffff;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-left: 100%;
            animation: ticker 1.5s linear inherit;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        h1 {
            color: #000;
            z-index: 1;
            margin: 45px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 2.8em;
            font-weight: bold;
            text-shadow: 0 3px 5px rgba(255, 255, 255, 0.5);
        }

        .untertitel-titel {
            color: #333;
            z-index: 1;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.3em;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .datum-untertitel {
            color: #333;
            z-index: 1;
            margin-bottom: 20px;
            font-size: 2.2em;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.5);
        }

        #info { 
            background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(5px);         
            padding: 25px; 
            border-radius: 12px; 
            width: 90%;
            max-width: 750px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7); 
            min-height: 150px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1;
            box-sizing: border-box;
        }

        .block-titel { font-size: 1.5em; color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; width: 100%;  font-weight: bold;}
        .lektion-eintrag { background: rgba(51, 51, 51, 0.5); margin: 8px 0; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #51ae32; width: 100%; box-sizing: border-box; }
        .klasse { font-size: 1.5em; color: rgb(255, 255, 255); font-weight: bold; }
        .halle { font-size: 1.2em; color: #ddd; font-weight: bold; }
        .hinweis { color: #fff; font-style: italic; margin-top: 15px; line-height: 1.4; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid rgb(82, 174, 50);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="news-ticker-banner" class="news-ticker-container">
        <span class="news-icon material-symbols-outlined">campaign</span>
        <div class="ticker-wrapper">
            <div id="news-ticker-content" class="ticker-text"></div>
        </div>
    </div>

    <h1>BBZ Olten – Sportunterricht</h1>
    <div class="untertitel-titel">Aktuelle Hallenbelegung</div>
    <div id="datum" class="datum-untertitel"></div>
    
    <div id="info">
        <div class="spinner"></div>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE CONFIG
        // ==========================================
        const SUPABASE_URL = "https://wztxlatxorzcwwimsgem.supabase.co";       
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6dHhsYXR4b3J6Y3d3aW1zZ2VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTk4OTcsImV4cCI6MjEwMTA3NTg5N30.3REF3A5DNpqhXyKgSh3RuLojLafRb1UCYNneeFtiQh4"; 

        const blockStartZeiten = [
            { startStunde: 7,  startMinute: 15, name: "Start 07:15" },
            { startStunde: 8,  startMinute: 5,  name: "Start 08:05" },
            { startStunde: 8,  startMinute: 55, name: "Start 08:55" },
            { startStunde: 10, startMinute: 0,  name: "Start 10:00" },
            { startStunde: 10, startMinute: 50, name: "Start 10:50" },
            { startStunde: 11, startMinute: 40, name: "Start 11:40" },
            { startStunde: 12, startMinute: 50, name: "Start 12:50" },
            { startStunde: 13, startMinute: 40, name: "Start 13:40" },
            { startStunde: 14, startMinute: 30, name: "Start 14:30" },
            { startStunde: 15, startMinute: 35, name: "Start 15:35" },
            { startStunde: 16, startMinute: 25, name: "Start 16:25" },
            { startStunde: 17, startMinute: 15, name: "Start 17:15" }
        ];

        const nowInitial = new Date();
        const optionsInitial = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('datum').innerText = nowInitial.toLocaleDateString('de-DE', optionsInitial);

        async function updateDisplay() {
            const div = document.getElementById('info');
            const tickerBanner = document.getElementById('news-ticker-banner');
            const tickerContent = document.getElementById('news-ticker-content');

            // --- 2. BANNER AUS SUPABASE LADEN (Nur wenn Status "offen") ---
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/service_db?typ=eq.banner&status=eq.offen&select=id,beschreibung`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                const bannerData = await response.json();

                if (Array.isArray(bannerData) && bannerData.length > 0) {
                    const alleMeldungen = bannerData.map(b => b.beschreibung).join(" &nbsp;&nbsp;&nbsp;&bull;&nbsp;&nbsp;&nbsp; ");
                    tickerContent.innerHTML = alleMeldungen;
                    tickerBanner.style.display = "flex";
                } else {
                    tickerBanner.style.display = "none";
                }
            } catch (err) {
                console.warn("Konnte Banner aus Supabase nicht laden:", err);
                tickerBanner.style.display = "none";
            }

            // --- 3. PLAN AUS BUCHUNGEN_DB NUR FÜR HEUTE LADEN ---
            let plan = {};
            try {
                const todayStr = new Date().toISOString().split('T')[0];

                const response = await fetch(`${SUPABASE_URL}/rest/v1/buchungen_db?select=slot,klasse,halle&datum=eq.${todayStr}`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                const buchungenData = await response.json();

                if (!Array.isArray(buchungenData)) {
                    console.error("Supabase Fehler:", buchungenData);
                    throw new Error(buchungenData.message || "Fehler beim Laden");
                }

                buchungenData.forEach(item => {
                    plan[item.slot] = {
                        klasse: item.klasse,
                        halle: item.halle
                    };
                });
            } catch (e) {
                console.warn("Fehler beim Laden der Buchungen aus Supabase:", e);
                div.innerHTML = `<div class="hinweis" style="color: #e74c3c;">Fehler beim Laden der Daten...</div>`;
                return;
            }

            const now = new Date();
            document.getElementById('datum').innerText = now.toLocaleDateString('de-DE', optionsInitial);

            const currentMinutesToday = now.getHours() * 60 + now.getMinutes();
            let aktivBlockIndex = -1;

            for (let i = 0; i < blockStartZeiten.length; i++) {
                const b = blockStartZeiten[i];
                const startMinuten = b.startStunde * 60 + b.startMinute;
                const sichtbarAbMinuten = startMinuten - 10;

                let gueltigBisMinuten = startMinuten + 50; 
                if (i < blockStartZeiten.length - 1) {
                    const naechsterB = blockStartZeiten[i + 1];
                    const naechsterStartMinuten = naechsterB.startStunde * 60 + naechsterB.startMinute;
                    gueltigBisMinuten = naechsterStartMinuten - 10;
                }

                if (currentMinutesToday >= sichtbarAbMinuten && currentMinutesToday < gueltigBisMinuten) {
                    aktivBlockIndex = i;
                    break;
                }
            }

            if (aktivBlockIndex === -1) {
                div.innerHTML = `
                    <div class="block-titel">Keine Hallenbelegung aktiv</div>
                    <div class="hinweis">Die Hallenbelegung ist erst 10 Minuten vor Lektionsbeginn einsehbar.</div>
                `;
                return;
            }

            const aktuellerBlock = blockStartZeiten[aktivBlockIndex];
            let startSlotId = (aktivBlockIndex * 5) + 1;
            let endSlotId = startSlotId + 4;

            let gefundeneEintraege = [];
            for (let s = startSlotId; s <= endSlotId; s++) {
                if (plan[s] && plan[s].halle && plan[s].halle.trim() !== "") {
                    gefundeneEintraege.push({
                        klasse: plan[s].klasse || "",
                        halle: plan[s].halle
                    });
                }
            }

            // --- NEUE SORTIERUNG: Hallen mit Nummern zuerst (aufsteigend), Rest alphabetisch ---
            gefundeneEintraege.sort((a, b) => {
                const hA = a.halle.toLowerCase();
                const hB = b.halle.toLowerCase();

                const getHallenNummer = (str) => {
                    const match = str.match(/halle\s*(\d+)/);
                    return match ? parseInt(match[1], 10) : 999;
                };

                const numA = getHallenNummer(hA);
                const numB = getHallenNummer(hB);

                if (numA !== 999 && numB !== 999) {
                    return numA - numB;
                }
                if (numA !== 999) {
                    return -1;
                }
                if (numB !== 999) {
                    return 1;
                }
                return hA.localeCompare(hB);
            });

            let html = `<div class="block-titel">${aktuellerBlock.name}</div>`;

            if (gefundeneEintraege.length > 0) {
                gefundeneEintraege.forEach(item => {
                    html += `
                        <div class="lektion-eintrag">
                            <span class="klasse">${item.klasse}</span>
                            <span class="halle">${item.halle}</span>
                        </div>
                    `;
                });
            } else {
                html += `<div class="hinweis">In diesem Zeitfenster sind aktuell keine Hallen belegt.</div>`;
            }

            div.innerHTML = html;
        }

        // --- 4. ZEITSTEUERUNG (Sofort-Start, 3-Minuten-Intervall & Tab-Fokus-Check) ---
        updateDisplay();
        
        let syncInterval = setInterval(updateDisplay, 3 * 60 * 1000);

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                console.log("Tab ist wieder aktiv – führe sofortigen Sync aus.");
                updateDisplay();
                
                clearInterval(syncInterval);
                syncInterval = setInterval(updateDisplay, 3 * 60 * 1000);
            }
        });
    </script>
</body>
</html>
